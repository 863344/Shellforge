name: Shellforge Plus Linux tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build with strict warnings
        run: make -f Makefile.plus CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -Werror -O2'
      - name: Check test script syntax
        run: sh -n tests/test_plus.sh
      - name: Run functional tests
        run: timeout 90 make -f Makefile.plus test
      - name: Install Valgrind on the disposable Ubuntu runner
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Audit memory and failure paths
        run: timeout 180 make -f Makefile.plus valgrind
